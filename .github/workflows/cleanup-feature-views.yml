name: cleanup-feature-views

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # Every 6 Hours

jobs:
  cleanup:
    runs-on: ubuntu-latest
    name: cleanup-feature-views

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Delete old feature view versions
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: el_carbon_intensity
          HOPSWORKS_HOST: eu-west.cloud.hopsworks.ai
        run: |
          uv run python cleanup_feature_views.py
